<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisitTadasuni - Reindirizzamento</title>
    
    <!-- Redirect automatico -->
    <meta http-equiv="refresh" content="0; url=https://property-cms-dev.preview.emergentagent.com/">
    
    <!-- SEO -->
    <meta name="description" content="Tadasuni Borgo Experience - Scopri il borgo, trova la tua casa nel cuore della Sardegna">
    <meta name="keywords" content="Tadasuni, Sardegna, borgo, immobili, case, lago Omodeo">
    
    <!-- Open Graph -->
    <meta property="og:title" content="VisitTadasuni - Borgo Experience">
    <meta property="og:description" content="Scopri Tadasuni, un piccolo gioiello della Sardegna affacciato sul Lago Omodeo">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://property-cms-dev.preview.emergentagent.com/">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #06b6d4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            background: rgba(255,255,255,0.2);
            border-radius: 30px;
            display: inline-block;
            transition: background 0.3s;
        }
        a:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>🏠 VisitTadasuni</h1>
        <p>Reindirizzamento in corso...</p>
        <a href="https://property-cms-dev.preview.emergentagent.com/">Clicca qui se non vieni reindirizzato</a>
    </div>
    
    <!-- JavaScript redirect backup -->
    <script>
        window.location.href = "https://property-cms-dev.preview.emergentagent.com/";
    </script>
</body>
</html>
